name: Auto Publish SEO Article

on:
  schedule:
    - cron: '0 0 * * *' # Runs every 24 hours (daily at midnight UTC)
  workflow_dispatch: # Allows manual execution from the GitHub Actions tab

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for committing and pushing generated articles back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required for proper Git tracking

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "Error: requirements.txt not found!" >&2
            exit 1
          fi

      - name: Run SEO content generator
        env:
          GEMINI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Error: GOOGLE_AI_API_KEY secret is not configured or empty!" >&2
            exit 1
          fi
          python generate.py

      - name: Commit and Push generated content
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage new posts and updated sitemap
          git add posts/ sitemap.xml
          
          # Check for staged changes to avoid redundant commits
          if git diff --staged --quiet; then
            echo "No new articles or updates detected. Skipping commit and push."
          else
            echo "New article detected. Committing and pushing to main branch..."
            git commit -m "chore: auto-publish new programmatic SEO article [skip ci]"
            git push origin HEAD:main
          fi
